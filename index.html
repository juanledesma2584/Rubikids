<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RU-Bi KiDS - Sistema POS</title>

  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #f4f6f9; margin: 0; padding: 15px; color: #333; }

    .card { background: #fff; padding: 16px; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 2px 6px rgba(0,0,0,0.04); }
    .card h2 { font-size: 1.1rem; margin-top: 0; color: #1976d2; }

    /* ESTILO MODERNO DE TARJETAS LIGERAS TIPO IMAGEN 2 */
    .stock-list { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
    
    .stock-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #f8fafd;
      border: 1px solid #e1e8ed;
      border-radius: 8px;
      padding: 8px 12px;
    }

    .stock-item .item-name {
      font-size: 0.9rem;
      color: #333;
      font-weight: 500;
    }

    .stock-item .item-badge {
      background: #ffffff;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 0.85rem;
      font-weight: bold;
      color: #1976d2;
      min-width: 60px;
      text-align: center;
      box-shadow: 0 1px 2px rgba(0,0,0,0.03);
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Stock Disponible en Local</h2>

    <!-- CONTENEDOR TIPO FILAS REDONDEADAS DE LA SEGUNDA IMAGEN -->
    <div class="stock-list" id="lista-stock-clean">
      <div class="stock-item">
        <span class="item-name">Lomito Completo</span>
        <span class="item-badge">999 un.</span>
      </div>
      <div class="stock-item">
        <span class="item-name">Gaseosas 600ml</span>
        <span class="item-badge">60 un.</span>
      </div>
      <div class="stock-item">
        <span class="item-name">Cerveza Heineken</span>
        <span class="item-badge">40 un.</span>
      </div>
      <div class="stock-item">
        <span class="item-name">Pan de Lomito</span>
        <span class="item-badge">60 un.</span>
      </div>
    </div>
  </div>

  <script>
    // Función JavaScript para renderizar dinámicamente con este estilo
    function renderStockClean(productos) {
      const contenedor = document.getElementById('lista-stock-clean');
      contenedor.innerHTML = '';

      productos.forEach(p => {
        contenedor.innerHTML += `
          <div class="stock-item">
            <span class="item-name">${p.nombre}</span>
            <span class="item-badge">${p.stock} un.</span>
          </div>`;
      });
    }
  </script>
</body>
</html>
